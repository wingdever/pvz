<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- 血液发光与模糊滤镜 -->
    <filter id="bloodGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- 飞溅血液渐变色 -->
    <radialGradient id="bloodSplat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3333" />
      <stop offset="100%" stop-color="#660000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 第一道爪痕（顶部） -->
  <g>
    <!-- 底层阴影与发光 -->
    <path d="M 15,95 L 28,78 L 22,58 L 45,40 L 38,22 L 58,10" fill="none" stroke="#330000" stroke-width="12" stroke-linecap="butt" stroke-linejoin="round" filter="url(#bloodGlow)" opacity="0.8"/>
    <!-- 中间暗红层 -->
    <path d="M 15,95 L 28,78 L 22,58 L 45,40 L 38,22 L 58,10" fill="none" stroke="#990000" stroke-width="6" stroke-linecap="butt" stroke-linejoin="round"/>
    <!-- 表面鲜红层 -->
    <path d="M 15,95 L 28,78 L 22,58 L 45,40 L 38,22 L 58,10" fill="none" stroke="#ff1a1a" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round"/>
    <!-- 血液高光层（模拟新鲜血液反光） -->
    <path d="M 15,95 L 28,78 L 22,58 L 45,40 L 38,22 L 58,10" fill="none" stroke="#ff8080" stroke-width="1" stroke-linecap="butt" stroke-linejoin="round"/>
    <!-- 碎裂的次生抓痕 -->
    <path d="M 22,58 L 35,50" fill="none" stroke="#cc0000" stroke-width="2" stroke-linecap="butt"/>
    <path d="M 38,22 L 48,18" fill="none" stroke="#cc0000" stroke-width="1.5" stroke-linecap="butt"/>
  </g>

  <!-- 第二道爪痕（中间） -->
  <g>
    <!-- 底层阴影与发光 -->
    <path d="M 42,110 L 55,92 L 48,70 L 72,52 L 65,32 L 88,18" fill="none" stroke="#330000" stroke-width="14" stroke-linecap="butt" stroke-linejoin="round" filter="url(#bloodGlow)" opacity="0.8"/>
    <!-- 中间暗红层 -->
    <path d="M 42,110 L 55,92 L 48,70 L 72,52 L 65,32 L 88,18" fill="none" stroke="#990000" stroke-width="7" stroke-linecap="butt" stroke-linejoin="round"/>
    <!-- 表面鲜红层 -->
    <path d="M 42,110 L 55,92 L 48,70 L 72,52 L 65,32 L 88,18" fill="none" stroke="#ff1a1a" stroke-width="3.5" stroke-linecap="butt" stroke-linejoin="round"/>
    <!-- 血液高光层 -->
    <path d="M 42,110 L 55,92 L 48,70 L 72,52 L 65,32 L 88,18" fill="none" stroke="#ff8080" stroke-width="1.2" stroke-linecap="butt" stroke-linejoin="round"/>
    <!-- 碎裂的次生抓痕 -->
    <path d="M 48,70 L 62,62" fill="none" stroke="#cc0000" stroke-width="2" stroke-linecap="butt"/>
    <path d="M 65,32 L 78,28" fill="none" stroke="#cc0000" stroke-width="2" stroke-linecap="butt"/>
  </g>

  <!-- 第三道爪痕（底部） -->
  <g>
    <!-- 底层阴影与发光 -->
    <path d="M 75,120 L 88,102 L 82,82 L 105,65 L 98,45 L 120,30" fill="none" stroke="#330000" stroke-width="10" stroke-linecap="butt" stroke-linejoin="round" filter="url(#bloodGlow)" opacity="0.8"/>
    <!-- 中间暗红层 -->
    <path d="M 75,120 L 88,102 L 82,82 L 105,65 L 98,45 L 120,30" fill="none" stroke="#990000" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round"/>
    <!-- 表面鲜红层 -->
    <path d="M 75,120 L 88,102 L 82,82 L 105,65 L 98,45 L 120,30" fill="none" stroke="#ff1a1a" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round"/>
    <!-- 血液高光层 -->
    <path d="M 75,120 L 88,102 L 82,82 L 105,65 L 98,45 L 120,30" fill="none" stroke="#ff8080" stroke-width="1" stroke-linecap="butt" stroke-linejoin="round"/>
    <!-- 碎裂的次生抓痕 -->
    <path d="M 82,82 L 95,75" fill="none" stroke="#cc0000" stroke-width="1.5" stroke-linecap="butt"/>
    <path d="M 98,45 L 110,40" fill="none" stroke="#cc0000" stroke-width="1.5" stroke-linecap="butt"/>
  </g>

  <!-- 血液飞溅与血滴粒子 -->
  <!-- 左侧飞溅 -->
  <circle cx="12" cy="102" r="4" fill="#990000" filter="url(#bloodGlow)"/>
  <circle cx="10" cy="98" r="2" fill="#ff1a1a"/>
  <circle cx="26" cy="72" r="3" fill="#660000" filter="url(#bloodGlow)"/>
  <circle cx="28" cy="70" r="1.5" fill="#ff1a1a"/>
  <circle cx="18" cy="85" r="1" fill="#ff1a1a"/>
  
  <!-- 中间飞溅 -->
  <circle cx="38" cy="108" r="5" fill="#660000" filter="url(#bloodGlow)"/>
  <circle cx="36" cy="106" r="2.5" fill="#ff1a1a"/>
  <circle cx="50" cy="115" r="3" fill="#990000" filter="url(#bloodGlow)"/>
  <circle cx="52" cy="114" r="1.5" fill="#ff8080"/>
  <circle cx="68" cy="60" r="2" fill="#ff1a1a" filter="url(#bloodGlow)"/>
  <circle cx="75" cy="48" r="1.5" fill="#ff1a1a"/>
  
  <!-- 右侧飞溅 -->
  <circle cx="72" cy="115" r="6" fill="#660000" filter="url(#bloodGlow)"/>
  <circle cx="70" cy="112" r="3" fill="#ff1a1a"/>
  <circle cx="78" cy="118" r="2" fill="#ff1a1a"/>
  <circle cx="92" cy="95" r="4" fill="#990000" filter="url(#bloodGlow)"/>
  <circle cx="94" cy="93" r="2" fill="#ff1a1a"/>
  <circle cx="112" cy="60" r="3" fill="#660000" filter="url(#bloodGlow)"/>
  <circle cx="110" cy="58" r="1.5" fill="#ff8080"/>
  <circle cx="122" cy="35" r="2" fill="#990000" filter="url(#bloodGlow)"/>
  <circle cx="124" cy="32" r="1" fill="#ff1a1a"/>

  <!-- 动态血滴（拉长的泪滴状） -->
  <path d="M 8,90 Q 6,85 12,84 Q 10,88 8,90" fill="#cc0000"/>
  <path d="M 30,65 Q 28,60 34,58 Q 32,62 30,65" fill="#cc0000"/>
  <path d="M 60,95 Q 58,88 65,87 Q 62,92 60,95" fill="#cc0000"/>
  <path d="M 88,80 Q 85,75 92,72 Q 90,76 88,80" fill="#cc0000"/>
  <path d="M 105,40 Q 102,35 108,32 Q 107,36 105,40" fill="#cc0000"/>
</svg>