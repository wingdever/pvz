<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- 发光滤镜 -->
    <filter id="slashGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- 渐变色：前端亮白，后端透明 -->
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="60%" stop-color="#a0e0ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0088ff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- 主斩击弧线 -->
  <path d="M 20,110 Q 64,30 110,60" fill="none" stroke="url(#slashGrad)" stroke-width="8" stroke-linecap="round" filter="url(#slashGlow)"/>
  <!-- 锐利的内侧高光 -->
  <path d="M 25,105 Q 64,35 105,60" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- 细小的速度线 -->
  <path d="M 30,100 Q 50,70 80,62" fill="none" stroke="#a0e0ff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 45,85 Q 60,60 90,60" fill="none" stroke="#a0e0ff" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
</svg>