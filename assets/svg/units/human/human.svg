<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- 调色板：
       肤色: #F2C6A0
       头发: #4A2C17
       衣服: #3B7DD8
       裤子: #2C5AA0
       鞋子: #2B2B2B
  -->
  <!-- 耳朵（后） -->
  <circle cx="71" cy="31" r="2" fill="#f2c6a0"/>
  <!-- 耳朵（前） -->
  <circle cx="57" cy="36" r="2" fill="#f2c6a0"/>
  <!-- 头部 -->
  <circle cx="65" cy="36" r="8" fill="#f2c6a0"/>
  <!-- 眼睛：朝右侧视（后） -->
  <circle cx="69" cy="33" r="1.5" fill="#2b2b2b"/>
  <!-- 眼睛：朝右侧视（前） -->
  <circle cx="64" cy="37" r="1.5" fill="#2b2b2b"/>
  <!-- 头发（覆盖后脑与头顶，后脑在左侧） -->
  <polygon points="68,26 67,21 60,28 56,25 56,34 57,37 61,32 66,29 70,30 76,25" fill="#4a2c17"/>
  <!-- 脖子 -->
  <rect x="62" y="43" width="5" height="5" fill="#f2c6a0"/>
  <!-- 躯干（侧视，前面朝右） -->
  <polygon points="59,48 71,48 70,80 58,80" fill="#f2c6a0"/>
  <!-- 后上臂 -->
  <polygon points="70,48 72,48 81,57 78,58 70,50" fill="#f2c6a0"/>
  <!-- 后下臂 -->
  <polygon points="78,57 81,57 84,64 80,64" fill="#f2c6a0"/>
  <!-- 后手 -->
  <circle cx="82" cy="65" r="3" fill="#f2c6a0"/>
  <!-- 后腿（右腿，靠后） -->
  <!-- 大腿 -->
  <polygon points="66,80 70,80 75,96 71,96" fill="#f2c6a0"/>
  <!-- 小腿 -->
  <polygon points="71,96 75,96 74,109 70,109" fill="#f2c6a0"/>
  <!-- 脚（朝右） -->
  <polygon points="70,109 74,109 80,112 70,112" fill="#f2c6a0"/>
  <!-- 前腿（左腿，靠后，整体略向左偏移） -->
  <!-- 大腿 -->
  <polygon points="58,80 62,80 62,96 58,96" fill="#f2c6a0"/>
  <!-- 小腿 -->
  <polygon points="58,96 62,96 61,109 57,109" fill="#f2c6a0"/>
  <!-- 脚（朝右） -->
  <polygon points="57,109 61,109 67,112 57,112" fill="#f2c6a0"/>
  <!-- 裤子头 -->
  <polygon points="58,80 64,79 63,97 57,97" fill="#2c5aa0"/>
  <!-- 前腿（右腿，靠前） -->
  <!-- 大腿 -->
  <polygon points="57,70 72,73 72,81 57,83" fill="#2c5aa0"/>
  <!-- 小腿 -->
  <polygon points="70,96 76,96 74,110 68,110" fill="#2c5aa0"/>
  <!-- 脚（朝右） -->
  <polygon points="68,108 74,107 81,112 69,112" fill="#2b2b2b"/>
  <!-- 后腿（左腿，靠后，整体略向左偏移） -->
  <!-- 大腿 -->
  <polygon points="65,81 72,81 77,96 70,96" fill="#2c5aa0"/>
  <!-- 小腿 -->
  <polygon points="57,94 63,94 61,108 55,108" fill="#2c5aa0"/>
  <!-- 脚（朝右） -->
  <polygon points="57,107 62,107 68,112 56,112" fill="#2b2b2b"/>
  <!-- 衬衫 -->
  <polygon points="58,46 72,46 72,75 57,76" fill="#3b7dd8"/>
  <!-- 左肩骨关节 -->
  <circle cx="59.5" cy="49.5" r="1.5" fill="#f2c6a0"/>
  <!-- 前上臂 -->
  <polygon points="43,48 59,48 59,51 43,51" fill="#f2c6a0"/>
  <!-- 左肘骨关节 -->
  <circle cx="42.5" cy="49.5" r="1.5" fill="#f2c6a0"/>
  <!-- 前下臂 -->
  <polygon points="41,50 44,50 43,59 40,59" fill="#f2c6a0"/>
  <!-- 前手持剑（剑体单多边形） -->
  <polygon points="73,46 107,34 74,49 50,58 42,61 41,59 49,56" fill="#2b2b2b"/>
  <!-- 前手 -->
  <circle cx="42" cy="60" r="3" fill="#f2c6a0"/>
</svg>