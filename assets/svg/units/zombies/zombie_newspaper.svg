<?xml version="1.0" encoding="UTF-8"?>
<!--
  PvZ turn-based: placeholder art v2, newspaper zombie.

  Same body as the basic zombie. Adds glasses on the face and a newspaper
  held in front of the chest. Newspaper is drawn LAST so it covers the
  arms and reads as being held up.

  Paper #E8D8B0, text lines #B0B8C0, glasses #5B5671.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- legs -->
  <rect x="50" y="82" width="10" height="28" fill="#5B5671"/>
  <rect x="68" y="82" width="10" height="28" fill="#5B5671"/>
  <!-- arms -->
  <polygon points="50,58 16,64 14,72 50,70" fill="#9E97BA"/>
  <polygon points="52,72 20,78 18,86 52,84" fill="#9E97BA"/>
  <!-- torso -->
  <polygon points="46,50 82,50 86,88 42,88" fill="#706A8B"/>
  <!-- head -->
  <rect x="48" y="24" width="32" height="30" fill="#9E97BA"/>

  <!-- newspaper -->
  <polygon points="10,52 48,52 48,90 10,90" fill="#E8D8B0"/>
  <!-- newspaper text lines -->
  <rect x="16" y="60" width="26" height="3" fill="#B0B8C0"/>
  <rect x="16" y="66" width="26" height="3" fill="#B0B8C0"/>
  <rect x="16" y="72" width="26" height="3" fill="#B0B8C0"/>
</svg>