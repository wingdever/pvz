<?xml version="1.0" encoding="UTF-8"?>
<!--
  PvZ turn-based: placeholder art v2, zombie.

  Canvas 128x128, drawn into the same 60x60 box as the plants.

  Pure fills, no strokes, no gradients (docs/HANDOFF.md 7.19). The zombie walks
  LEFT (towards the house), so both arms reach out to the left and the sprite is
  deliberately asymmetric: head, torso and legs stay centred on the cell centre,
  only the arms hang over the cell edge towards its victim.

  Once a sprite is in use, zombie.gd skips the flat shape's facing marker
  (Unit.has_art()) - the pose already says which way it walks.

  Three tones, all derived from Balance.COLOR_ZOMBIE (0.55, 0.52, 0.68) = #8C85AD:
    skin   lightened(0.15)   #9E97BA    head and arms
    shirt  darkened(0.20)    #706A8B    torso
    legs   darkened(0.35)    #5B5671    legs
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- legs: two blocks, feet end at y 110 -->
  <rect x="50" y="82" width="10" height="28" fill="#5B5671"/>
  <rect x="68" y="82" width="10" height="28" fill="#5B5671"/>
  <!-- arms: both reach left, the classic shamble -->
  <polygon points="50,58 16,64 14,72 50,70" fill="#9E97BA"/>
  <polygon points="52,72 20,78 18,86 52,84" fill="#9E97BA"/>
  <!-- torso: shoulders narrow, hips a little wider -->
  <polygon points="46,50 82,50 86,88 42,88" fill="#706A8B"/>
  <!-- head: a plain block, no face while detail is out of scope -->
  <rect x="48" y="24" width="32" height="30" fill="#9E97BA"/>
</svg>
