        fill="#2D8636"/>

  <!-- pepper body: wide at the top, tapering down and curling up at the tip -->
  <path d="M 40,40
           Q 34,58 36,78
           Q 38,98 54,114
           Q 66,124 80,116
           Q 90,108 88,94
           Q 84,64 78,46
           Q 74,38 64,38
           Q 50,38 40,40 Z"
        fill="#E53935"/>
</svg>