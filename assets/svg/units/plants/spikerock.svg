<?xml version="1.0" encoding="UTF-8"?>
<!--
  PvZ turn-based: placeholder art v2, spikerock.

  All polygon, no path.
    base      : wide dark-grey rocky mound
    centre    : one large white crystal spike
    side horns: two big white spikes, left and right
    row       : many small grey spikes along the top
    eyes      : two yellow slits with red pupils
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- small spikes: back row along the top -->
  <polygon points="18,92 24,66 30,92" fill="#A8A8B0"/>
  <polygon points="30,92 36,58 42,92" fill="#A8A8B0"/>
  <polygon points="44,92 50,50 56,92" fill="#A8A8B0"/>
  <polygon points="72,92 78,50 84,92" fill="#A8A8B0"/>
  <polygon points="86,92 92,58 98,92" fill="#A8A8B0"/>
  <polygon points="98,92 104,66 110,92" fill="#A8A8B0"/>

  <!-- centre: large white crystal -->
  <polygon points="56,92 64,18 72,92" fill="#F0F0F8"/>
  <polygon points="64,18 72,92 64,92" fill="#C8C8D8"/>

  <!-- side horns: two big white spikes -->
  <polygon points="22,92 14,42 30,88" fill="#F0F0F8"/>
  <polygon points="22,92 14,42 22,86" fill="#C8C8D8"/>
  <polygon points="106,92 114,42 98,88" fill="#F0F0F8"/>
  <polygon points="98,88 106,92 98,90" fill="#C8C8D8"/>

  <!-- eyes: yellow slits with red pupils -->
  <polygon points="40,88 58,86 60,96 42,98" fill="#F4D040"/>
  <polygon points="70,86 88,88 86,98 68,96" fill="#F4D040"/>
  <polygon points="52,88 58,87 58,94 52,95" fill="#E53935"/>
  <polygon points="70,87 76,88 76,95 70,94" fill="#E53935"/>

  <!-- base: wide dark-grey rocky mound -->
  <polygon points="6,102 18,94 38,90 64,88 90,90 110,94 122,102
                   118,116 90,120 64,122 38,120 10,116"
           fill="#5A5A62"/>
  <!-- base bottom edge: darker -->
  <polygon points="10,116 38,120 64,122 90,120 118,116 118,122 64,126 10,122"
           fill="#3A3A42"/>
  <!-- base shading: darker grey on the right -->
  <polygon points="90,90 110,94 122,102 118,116 90,120 90,90" fill="#4A4A52"/>
</svg>