<?xml version="1.0" encoding="UTF-8"?>
<!--
  PvZ turn-based: placeholder art v2, tangle-kelp.

  A mass of dark-green vines with red tips, a black centre with two red
  glowing eyes, and a light blue wave line at the bottom. All polygon,
  no path.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- bottom wave: light blue strip -->
  <polygon points="10,114 30,110 50,114 70,110 90,114 110,110 118,114
                   118,122 10,122"
           fill="#C8E8F0"/>

  <!-- outer vines: several green curved strips with red tips -->
  <!-- top-left vine -->
  <polygon points="20,80 24,60 34,44 44,36 46,44 36,52 28,66 26,80" fill="#2E7D32"/>
  <polygon points="44,36 40,32 44,28 48,32" fill="#E53935"/>
  <!-- top-centre-left vine -->
  <polygon points="40,70 42,50 52,34 62,28 64,36 54,42 46,54 46,70" fill="#3A8A3A"/>
  <polygon points="62,28 58,24 62,20 66,24" fill="#E53935"/>
  <!-- top-centre-right vine -->
  <polygon points="64,70 66,52 76,36 86,30 88,38 78,44 70,56 70,70" fill="#3A8A3A"/>
  <polygon points="86,30 82,26 86,22 90,26" fill="#E53935"/>
  <!-- top-right vine -->
  <polygon points="84,80 88,64 98,50 108,44 110,52 100,58 92,70 90,80" fill="#2E7D32"/>
  <polygon points="108,44 104,40 108,36 112,40" fill="#E53935"/>

  <!-- side vines: shorter ones on the left and right -->
  <polygon points="10,90 18,78 22,84 16,94" fill="#2E7D32"/>
  <polygon points="18,78 14,74 18,70 22,74" fill="#E53935"/>
  <polygon points="118,90 110,78 106,84 112,94" fill="#2E7D32"/>
  <polygon points="110,78 114,74 110,70 106,74" fill="#E53935"/>

  <!-- central black mass -->
  <polygon points="30,80 40,68 58,62 70,62 88,68 98,80
                   98,96 88,108 70,114 58,114 40,108 30,96"
           fill="#0A1A0A"/>

  <!-- red eyes inside the black mass -->
  <polygon points="40,82 56,78 60,88 42,90" fill="#E53935"/>
  <polygon points="72,78 88,82 86,90 68,88" fill="#E53935"/>

  <!-- inner vine highlights over the black mass -->
  <polygon points="36,84 46,74 50,78 40,88" fill="#3A8A3A"/>
  <polygon points="92,84 82,74 78,78 88,88" fill="#3A8A3A"/>
</svg>