<?xml version="1.0" encoding="UTF-8"?>
<!--
  PvZ turn-based: placeholder art v2, blover.

  Three heart-shaped leaves around a round face, with a short stem and a
  small patch of soil. Flat shapes only, no strokes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- stem -->
  <polygon points="62,80 66,80 66,116 62,116" fill="#2E7D32"/>
  <!-- soil -->
  <ellipse cx="64" cy="118" rx="10" ry="4" fill="#8B5A2B"/>

  <!-- top leaf -->
  <polygon points="64,16 48,36 54,48 64,42 74,48 80,36" fill="#7FD84A"/>
  <polygon points="64,22 56,36 60,42 64,36 68,42 72,36" fill="#A8E060"/>

  <!-- left leaf -->
  <polygon points="24,64 36,48 48,54 42,64 48,74 36,80" fill="#7FD84A"/>
  <polygon points="30,64 38,56 42,60 38,64 42,68 38,72" fill="#A8E060"/>

  <!-- right leaf -->
  <polygon points="104,64 92,48 80,54 86,64 80,74 92,80" fill="#7FD84A"/>
  <polygon points="98,64 90,56 86,60 90,64 86,68 90,72" fill="#A8E060"/>

  <!-- face -->
  <circle cx="64" cy="64" r="18" fill="#A8E060"/>
  <circle cx="58" cy="60" r="3" fill="#2A2A2A"/>
  <circle cx="70" cy="60" r="3" fill="#2A2A2A"/>
  <ellipse cx="64" cy="70" rx="3" ry="2" fill="#2A2A2A"/>
</svg>