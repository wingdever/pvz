<?xml version="1.0" encoding="UTF-8"?>
<!--
  Pepper-king-omega. Horns are drawn BEFORE the leaves so they sit
  behind them. Has hands. Scythe is larger. Ground fire is smaller.
  Draw order: ground fire -> wings -> horns -> leaves -> body -> face -> hands -> scythe pole/blade.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- smaller ground fire -->
  <polygon points="36,116 46,100 56,112 64,98 72,112 82,100 92,116 88,124 40,124" fill="#F4A020"/>
  <polygon points="46,116 54,104 62,114 70,104 78,116 74,122 50,122" fill="#FFD040"/>

  <!-- bat wings behind the body -->
  <polygon points="2,74 22,64 28,80 14,90 28,96 14,106 0,98" fill="#1A3A5A"/>
  <polygon points="126,74 106,64 100,80 114,90 100,96 114,106 128,98" fill="#1A3A5A"/>
  <polygon points="6,78 20,70 22,80 8,88" fill="#2196F3"/>
  <polygon points="122,78 108,70 106,80 120,88" fill="#2196F3"/>

  <!-- wing fire -->
  <polygon points="6,56 16,32 28,50 38,28 48,52 38,68 20,70 10,64" fill="#F4A020"/>
  <polygon points="14,56 22,38 30,52 36,38 42,54 32,64 22,62" fill="#FFD040"/>
  <polygon points="122,56 112,32 100,50 90,28 80,52 90,68 108,70 118,64" fill="#F4A020"/>
  <polygon points="114,56 106,38 98,52 92,38 86,54 96,64 106,62" fill="#FFD040"/>

  <!-- demon horns: drawn BEFORE leaves so leaves cover their base -->
  <polygon points="48,56 34,6 60,40" fill="#4A2E1A"/>
  <polygon points="36,18 42,4 48,18 40,26" fill="#4A2E1A"/>
  <polygon points="80,56 94,6 68,40" fill="#4A2E1A"/>
  <polygon points="92,18 86,4 80,18 88,26" fill="#4A2E1A"/>

  <!-- small flame between the two horns -->
  <polygon points="60,28 66,16 70,26 68,34 62,36 58,32" fill="#F4A020"/>
  <polygon points="62,28 66,20 68,28 64,32" fill="#FFD040"/>

  <!-- leaves: drawn AFTER horns so they cover the horn bases -->
  <polygon points="60,46 68,46 66,34 62,34" fill="#2E7D32"/>
  <polygon points="60,42 44,36 50,46 60,50" fill="#4CAF50"/>
  <polygon points="68,42 84,36 78,46 68,50" fill="#4CAF50"/>

  <!-- pumpkin body -->
  <polygon points="42,66 50,50 64,46 78,50 86,66 86,96 78,108 64,114 50,108 42,96" fill="#E88A10"/>
  <polygon points="54,50 58,50 58,112 54,110" fill="#C87000"/>
  <polygon points="70,50 74,50 74,110 70,112" fill="#C87000"/>

  <!-- face -->
  <polygon points="46,72 58,68 60,76 48,80" fill="#FFD040"/>
  <polygon points="70,68 82,72 80,80 68,76" fill="#FFD040"/>
  <polygon points="46,88 54,86 58,92 66,86 74,90 82,86 78,98 70,96 64,100 56,96" fill="#FFD040"/>

  <!-- green hands -->
  <polygon points="16,90 30,82 38,92 30,102 16,100" fill="#4CAF50"/>
  <polygon points="112,90 98,82 90,92 98,102 112,100" fill="#4CAF50"/>

  <!-- BIG scythe: long pole from lower-left to upper-right -->
  <polygon points="-8,116 124,36 128,46 0,126" fill="#8B5A2B"/>

  <!-- scythe blade at the upper-right end, much larger -->
  <polygon points="118,36 130,4 148,0 142,26 124,48" fill="#C83040"/>
  <polygon points="122,36 130,10 140,6 136,24 124,44" fill="#F0E8E0"/>
</svg>