<?xml version="1.0" encoding="UTF-8"?>
<!--
  PvZ turn-based: placeholder art v2, winter-melon.
  Same layout as melon-pult, but the body and projectile use the ice
  palette. Two ice crystals sit on the body for a frozen look.
  All polygon / rect, no path.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- leaf base -->
  <polygon points="22,114 36,102 64,96 92,102 106,114 92,122 64,124 36,122" fill="#4CAF50"/>
  <polygon points="38,114 52,104 64,100 64,120 52,120" fill="#2E7D32"/>
  <polygon points="90,114 76,104 64,100 64,120 76,120" fill="#2E7D32"/>

  <!-- icy melon body -->
  <polygon points="36,72 44,62 64,56 84,62 92,72 92,100 84,110 64,114 44,110 36,100" fill="#7FD8E8"/>
  <!-- darker stripes -->
  <polygon points="46,66 52,62 52,106 46,102" fill="#4AB8D8"/>
  <polygon points="60,58 64,56 64,112 60,112" fill="#4AB8D8"/>
  <polygon points="76,62 82,66 82,102 76,106" fill="#4AB8D8"/>

  <!-- ice crystals on the body -->
  <polygon points="44,66 48,58 52,66" fill="#E8F8FF"/>
  <polygon points="76,60 80,52 84,60" fill="#E8F8FF"/>

  <!-- eyes -->
  <circle cx="54" cy="86" r="3" fill="#2A2A2A"/>
  <circle cx="74" cy="86" r="3" fill="#2A2A2A"/>
  <circle cx="55" cy="85" r="1" fill="#FFFFFF"/>
  <circle cx="75" cy="85" r="1" fill="#FFFFFF"/>

  <!-- curly stem -->
  <polygon points="58,58 66,58 30,26 22,34" fill="#2E7D32"/>
  <polygon points="34,30 40,26 44,32 38,36" fill="#2E7D32"/>
  <polygon points="42,24 48,20 52,26 46,30" fill="#2E7D32"/>

  <!-- projectile: icy melon -->
  <polygon points="2,26 10,14 26,10 40,16 40,32 28,44 12,42" fill="#7FD8E8"/>
  <polygon points="10,20 18,14 18,40 10,38" fill="#4AB8D8"/>
  <polygon points="26,14 36,20 34,34 26,40" fill="#4AB8D8"/>
  <!-- ice highlight on the projectile -->
  <polygon points="14,18 20,14 20,24 14,24" fill="#E8F8FF"/>
</svg>