<?xml version="1.0" encoding="UTF-8"?>
<!--
  PvZ turn-based: placeholder art v2, split pea.

  Same stem + leaves + front head as peashooter. A smaller rear head
  grows out of the front head's back: it is drawn BEHIND the front head,
  so only its left-facing mouth and upper part are visible.

  Front head (same as peashooter)  : 38,30 90,40 90,58 38,68
  Rear head  (drawn first)         : 10,28 55,20 55,52 10,38
    narrow edge (mouth) on the left,  x = 10, y 28..38
    wide edge (back)   on the right, x = 55, y 20..52
    Right side is hidden by the front head, so the visible part grows
    straight out of the front head's back.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- stem -->
  <polygon points="58,112 70,112 67,58 61,58" fill="#2D8636"/>
  <!-- base leaves -->
  <polygon points="62,92 22,72 18,86 58,102" fill="#38A843"/>
  <polygon points="66,92 106,72 110,86 70,102" fill="#38A843"/>

  <!-- rear head: drawn first, mostly hidden behind the front head -->
  <polygon points="10,28 55,20 55,52 10,38" fill="#38A843"/>

  <!-- front head: same as peashooter, drawn on top -->
  <polygon points="38,30 90,40 90,58 38,68" fill="#40BF4D"/>
</svg>