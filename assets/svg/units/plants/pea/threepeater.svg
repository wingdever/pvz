<?xml version="1.0" encoding="UTF-8"?>
<!--
  PvZ turn-based: placeholder art v2, threepeater.

  Same stem + leaves + main head as peashooter. Two smaller heads keep
  the SAME trapezoid shape as the main head (only scaled down), drawn
  behind it:
    rear-lower small head : shifted back (left) and down
    front-upper small head: shifted forward (right) and up
  Both overlap the main head so they read as growing out of it.

  Main head (same as peashooter): 38,30 90,40 90,58 38,68
  Small heads are the main head scaled to 0.6 about its top-left corner,
  then translated:
    rear-lower  : 20,52 51,58 51,69 20,75
    front-upper : 56,12 87,18 87,29 56,35
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- stem -->
  <polygon points="58,112 70,112 67,58 61,58" fill="#2D8636"/>
  <!-- base leaves -->
  <polygon points="62,92 22,72 18,86 58,102" fill="#38A843"/>
  <polygon points="66,92 106,72 110,86 70,102" fill="#38A843"/>

  <!-- front-upper small head: drawn first, behind the main head -->
  <polygon points="70,22 101,28 101,39 70,45" fill="#38A843"/>

  <!-- main head: same as peashooter, drawn on top -->
  <polygon points="38,30 90,40 90,58 38,68" fill="#40BF4D"/>

  <!-- rear-lower small head: drawn first, behind the main head -->
  <polygon points="20,52 51,58 51,69 20,75" fill="#38A843"/>
</svg>