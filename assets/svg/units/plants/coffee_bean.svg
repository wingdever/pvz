<?xml version="1.0" encoding="UTF-8"?>
<!--
  PvZ turn-based: placeholder art v2, coffee-bean.

  A dark-brown bean body with a green sprout on top and two wide-open
  eyes. Flat shapes only, no strokes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- sprout: green leafy tuft on top -->
  <polygon points="44,32 36,14 46,10 50,26" fill="#4CAF50"/>
  <polygon points="52,26 54,8 66,6 62,24" fill="#4CAF50"/>
  <polygon points="64,24 74,10 84,16 72,30" fill="#4CAF50"/>
  <polygon points="48,30 52,18 62,20 58,32" fill="#2E7D32"/>

  <!-- bean body: rounded oval, slightly tilted -->
  <polygon points="28,50 40,36 64,30 88,38 100,58 102,86
                   94,108 74,120 50,120 32,108 24,86"
           fill="#6B4A2E"/>
  <!-- highlight: lighter brown patch on the upper-left -->
  <polygon points="34,56 42,42 60,38 62,54 46,62" fill="#8B6A4A"/>

  <!-- eyes: two big white ovals -->
  <ellipse cx="48" cy="66" rx="16" ry="14" fill="#FFFFFF"/>
  <ellipse cx="80" cy="64" rx="14" ry="13" fill="#FFFFFF"/>
  <!-- pupils: small dark dots -->
  <circle cx="52" cy="68" r="3" fill="#2A2A2A"/>
  <circle cx="84" cy="66" r="3" fill="#2A2A2A"/>
  <circle cx="53" cy="67" r="1" fill="#FFFFFF"/>
  <circle cx="85" cy="65" r="1" fill="#FFFFFF"/>

  <!-- mouth: small smile -->
  <polygon points="60,92 74,92 70,100 64,100" fill="#3A2010"/>
  <polygon points="64,94 70,94 68,98 66,98" fill="#F0E8E0"/>
</svg>