<?xml version="1.0" encoding="UTF-8"?>
<!--
  PvZ turn-based: placeholder art v2, plantern.

  A lantern with a dark frame, glowing yellow panel, green side leaves
  and a root base. Flat shapes only, no strokes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- side leaves -->
  <polygon points="14,52 30,44 34,60 18,66" fill="#4CAF50"/>
  <polygon points="114,52 98,44 94,60 110,66" fill="#4CAF50"/>
  <polygon points="30,44 40,36 44,50 34,60" fill="#38A843"/>
  <polygon points="98,44 88,36 84,50 94,60" fill="#38A843"/>

  <!-- root base -->
  <polygon points="50,112 64,102 78,112 72,124 56,124" fill="#6B4A2E"/>
  <polygon points="40,116 50,106 58,116 50,124 42,122" fill="#8B5A2B"/>
  <polygon points="88,116 78,106 70,116 78,124 86,122" fill="#8B5A2B"/>

  <!-- post -->
  <rect x="60" y="76" width="8" height="30" fill="#6B4A2E"/>

  <!-- glowing panel -->
  <polygon points="40,40 88,40 88,80 40,80" fill="#FFF080"/>
  <circle cx="52" cy="54" r="3" fill="#FFFFFF"/>
  <circle cx="76" cy="50" r="2.5" fill="#FFFFFF"/>
  <circle cx="68" cy="68" r="2" fill="#FFFFFF"/>
  <circle cx="48" cy="70" r="2" fill="#FFFFFF"/>

  <!-- hood -->
  <polygon points="36,36 92,36 84,48 44,48" fill="#6B4A2E"/>
  <polygon points="44,48 84,48 88,40 40,40" fill="#8B5A2B"/>
  <circle cx="64" cy="28" r="6" fill="#E8A020"/>

  <!-- frame legs -->
  <polygon points="40,80 36,96 44,96 46,80" fill="#6B4A2E"/>
  <polygon points="88,80 92,96 84,96 82,80" fill="#6B4A2E"/>
  <polygon points="34,92 36,96 44,96 42,92" fill="#4A2E1A"/>
  <polygon points="94,92 92,96 84,96 86,92" fill="#4A2E1A"/>
</svg>