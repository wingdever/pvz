<?xml version="1.0" encoding="UTF-8"?>
<!--
  PvZ turn-based: placeholder art v2, cob-cannon.

  Drawn across the full 128x128 canvas, but the body intentionally
  overflows the single-cell bounds. Balance.UNIT_ART_SCALE and
  UNIT_ART_OFFSET stretch it to two cells and shift it half a cell left.

  Flat shapes only, no strokes.
    husk   : dark-green corn husk, pointed to the right
    cob    : yellow kernels at the right end
    cart   : brown wooden base
    wheels : two pale-cream wheels with scalloped rims
    tendril: green curl on the left
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- tendril: green curl on the left -->
  <polygon points="4,58 14,52 18,60 10,66" fill="#2E7D32"/>
  <polygon points="10,66 4,74 12,78 16,70" fill="#2E7D32"/>

  <!-- cart: brown wooden base -->
  <polygon points="18,80 118,80 122,96 14,96" fill="#8B5A2B"/>
  <polygon points="14,96 122,96 122,102 14,102" fill="#6B4A2E"/>
  <!-- cart plank lines: darker strips -->
  <polygon points="30,80 32,80 32,96 30,96" fill="#6B4A2E"/>
  <polygon points="60,80 62,80 62,96 60,96" fill="#6B4A2E"/>
  <polygon points="90,80 92,80 92,96 90,96" fill="#6B4A2E"/>

  <!-- corn husk: dark green, pointed to the right -->
  <polygon points="24,44 60,30 96,34 110,52 100,72 60,78 28,72 18,58"
           fill="#4CAF50"/>
  <!-- husk shading: darker green strip along the bottom -->
  <polygon points="24,44 60,30 96,34 110,52 100,72 60,78 28,72 18,58
                   28,66 60,70 92,66 96,52 60,44 26,52"
           fill="#2E7D32"/>

  <!-- eye: a single slit on the husk -->
  <polygon points="56,52 76,50 78,58 56,60" fill="#F0E8E0"/>
  <polygon points="68,52 76,51 76,58 68,59" fill="#E53935"/>

  <!-- corn cob: yellow kernels at the right end -->
  <polygon points="86,52 110,46 118,58 116,72 102,76 88,72" fill="#F4D040"/>
  <!-- kernels: darker yellow rows -->
  <polygon points="90,56 102,52 102,58 90,62" fill="#E8B820"/>
  <polygon points="90,64 104,60 104,66 90,70" fill="#E8B820"/>
  <polygon points="106,50 114,48 114,56 106,58" fill="#E8B820"/>

  <!-- wheels: pale-cream scalloped discs -->
  <circle cx="40" cy="98" r="18" fill="#E8E0C0"/>
  <circle cx="40" cy="98" r="12" fill="#F0E8D0"/>
  <circle cx="40" cy="98" r="4" fill="#C8C0A0"/>
  <circle cx="96" cy="98" r="18" fill="#E8E0C0"/>
  <circle cx="96" cy="98" r="12" fill="#F0E8D0"/>
  <circle cx="96" cy="98" r="4" fill="#C8C0A0"/>

  <!-- wheel scallops: small cream triangles around the rim -->
  <polygon points="22,98 28,96 28,100" fill="#F0E8D0"/>
  <polygon points="58,98 52,96 52,100" fill="#F0E8D0"/>
  <polygon points="40,80 38,86 42,86" fill="#F0E8D0"/>
  <polygon points="40,116 38,110 42,110" fill="#F0E8D0"/>
  <polygon points="78,98 84,96 84,100" fill="#F0E8D0"/>
  <polygon points="114,98 108,96 108,100" fill="#F0E8D0"/>
  <polygon points="96,80 94,86 98,86" fill="#F0E8D0"/>
  <polygon points="96,116 94,110 98,110" fill="#F0E8D0"/>
</svg>