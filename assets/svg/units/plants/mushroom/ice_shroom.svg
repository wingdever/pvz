<?xml version="1.0" encoding="UTF-8"?>
<!--
  PvZ turn-based: placeholder art v2, ice-shroom.

  Built from three polygon parts, per the spec:
    - stem  : polygon (pale ice-blue block, wider at the base)
    - cap   : polygon (light ice-blue dome)
    - spikes: many polygons on top of the cap, in two blues so they read
              as a crystal cluster

  Colour follows the ice palette:
    stem/cap base  #A8E0F0
    cap shadow     #7FD8E8
    spikes light   #7FD8E8
    spikes dark    #4AB8D8
    eyes           #E8F8FF
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- stem: polygon, wider at the base -->
  <polygon points="46,72 82,72 86,124 42,124" fill="#A8E0F0"/>

  <!-- cap: polygon dome -->
  <polygon points="26,74 34,52 50,42 78,42 94,52 102,74" fill="#7FD8E8"/>
  <!-- cap top highlight strip -->
  <polygon points="34,52 50,42 78,42 94,52 78,50 50,50" fill="#A8E0F0"/>

  <!-- eyes: two thin pale slits -->
  <polygon points="52,76 60,74 60,80 52,82" fill="#E8F8FF"/>
  <polygon points="68,74 76,76 76,82 68,80" fill="#E8F8FF"/>

  <!-- ice spikes: dark blue backing row -->
  <polygon points="18,66 24,38 30,60" fill="#4AB8D8"/>
  <polygon points="30,60 40,24 46,54" fill="#4AB8D8"/>
  <polygon points="46,54 58,16 66,48" fill="#4AB8D8"/>
  <polygon points="66,48 78,16 86,50" fill="#4AB8D8"/>
  <polygon points="86,50 96,28 102,58" fill="#4AB8D8"/>
  <polygon points="102,58 110,40 114,64" fill="#4AB8D8"/>

  <!-- ice spikes: light blue front row, shorter and offset -->
  <polygon points="26,62 32,32 38,58" fill="#7FD8E8"/>
  <polygon points="38,56 48,20 54,52" fill="#7FD8E8"/>
  <polygon points="54,50 64,12 72,46" fill="#7FD8E8"/>
  <polygon points="72,46 82,20 88,48" fill="#7FD8E8"/>
  <polygon points="88,48 98,30 104,56" fill="#7FD8E8"/>
  <polygon points="104,56 112,42 116,62" fill="#7FD8E8"/>

  <!-- bottom ice shards: small polygons at the base -->
  <polygon points="40,124 46,112 52,124" fill="#4AB8D8"/>
  <polygon points="56,124 62,110 68,124" fill="#4AB8D8"/>
  <polygon points="72,124 78,112 84,124" fill="#4AB8D8"/>
</svg>