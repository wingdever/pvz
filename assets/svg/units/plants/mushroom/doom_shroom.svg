<?xml version="1.0" encoding="UTF-8"?>
<!--
  PvZ turn-based: placeholder art v2, doom-shroom.

  Built from exactly three kinds of parts, per the spec:
    - cap    : polygon (dark charcoal dome, slightly wider than tall)
    - stem   : rect (mid grey, vertical grain)
    - eyes   : two rects (bright red, angled to look angry)

  Colours pulled from the reference: cap #2A2A2A / #1A1A1A, stem
  #5A5A5A with darker grain #3A3A3A, eyes #E53935.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- stem: mid grey rectangle -->
  <rect x="46" y="66" width="36" height="56" fill="#5A5A5A"/>
  <!-- vertical grain on the stem: two darker rects -->
  <rect x="52" y="74" width="3" height="44" fill="#3A3A3A"/>
  <rect x="74" y="78" width="3" height="40" fill="#3A3A3A"/>

  <!-- cap: dark charcoal polygon, dome shape -->
  <polygon points="14,70 22,40 40,22 64,16 88,22 106,40 114,70"
           fill="#2A2A2A"/>

  <!-- eyes: two red rectangles, inner edge raised for an angry look -->
  <polygon points="34,62 56,54 56,62 34,66" fill="#E53935"/>
  <polygon points="72,54 94,62 94,66 72,62" fill="#E53935"/>
</svg>