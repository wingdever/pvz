<?xml version="1.0" encoding="UTF-8"?>
<!--
  PvZ turn-based: placeholder art v2, hypno-shroom.

  Rainbow cap built as several flat colour patches (no gradients, per the
  palette rule) so the tint distribution reads like the reference: warm
  yellow/orange top-left, green top-centre, pink top-right, blue lower-left,
  pink/purple centre and right. Cream stem, two red spiral eyes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- stem: cream -->
  <rect x="46" y="70" width="36" height="48" rx="10" fill="#F0E8DC"/>

  <!-- cap base (pink) -->
  <path d="M 18,72 Q 18,24 64,24 Q 110,24 110,72 Z" fill="#F0A0C0"/>

  <!-- top-left warm: yellow -->
  <path d="M 18,72 Q 18,24 64,24 L 64,72 Z" fill="#F4E070"/>
  <!-- top-left orange overlay -->
  <path d="M 22,60 Q 26,32 48,28 L 44,58 Z" fill="#F4B060"/>

  <!-- top-centre green -->
  <path d="M 64,24 Q 88,24 96,44 L 64,60 Z" fill="#A8E0A0"/>

  <!-- top-right pink -->
  <path d="M 96,44 Q 108,58 110,72 L 64,72 L 64,60 Z" fill="#F0A0C0"/>

  <!-- lower-left blue -->
  <path d="M 18,72 L 64,72 L 64,72 Q 40,78 18,72 Z" fill="#A0C0F0"/>
  <path d="M 20,66 Q 30,70 52,68 L 56,72 L 18,72 Z" fill="#A0C0F0"/>

  <!-- centre purple -->
  <path d="M 48,58 L 64,60 L 64,72 L 54,72 Z" fill="#C0A0E0"/>

  <!-- right pink deepening -->
  <path d="M 90,60 Q 104,64 110,72 L 64,72 L 64,60 Z" fill="#E080A0"/>

  <!-- eyes: red spirals on the stem -->
  <path d="M 60,90
           a 2,2 0 1 1 -3,1
           a 4,4 0 1 1 6,-2
           a 6,6 0 1 1 -9,3"
        fill="none" stroke="#C02030" stroke-width="1.2"/>
  <path d="M 78,90
           a 2,2 0 1 1 -3,1
           a 4,4 0 1 1 6,-2
           a 6,6 0 1 1 -9,3"
        fill="none" stroke="#C02030" stroke-width="1.2"/>
</svg>