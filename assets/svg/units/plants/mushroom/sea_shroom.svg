<?xml version="1.0" encoding="UTF-8"?>
<!--
  PvZ turn-based: placeholder art v2, sea-shroom.

  Green cap with dark spots, green stem, muzzle on the right, tentacles
  at the bottom. All polygon / rect, no path.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- tentacles: five thin polygons at the bottom -->
  <polygon points="36,100 40,100 34,124 30,124" fill="#A8D8B0"/>
  <polygon points="50,102 54,102 50,126 46,126" fill="#A8D8B0"/>
  <polygon points="62,102 66,102 64,128 60,128" fill="#A8D8B0"/>
  <polygon points="74,102 78,102 82,126 78,126" fill="#A8D8B0"/>
  <polygon points="88,100 92,100 98,124 94,124" fill="#A8D8B0"/>

  <!-- stem: green rounded block -->
  <polygon points="46,72 82,72 84,104 44,104" fill="#40C878"/>

  <!-- muzzle on the stem: outer rim + dark hole -->
  <polygon points="82,78 96,76 100,86 100,96 96,106 82,104 80,90" fill="#1A8A50"/>
  <polygon points="86,82 94,81 96,88 96,94 94,100 86,99 84,90" fill="#0A4A2A"/>

  <!-- cap: near-half ellipse, 12-point polygon -->
  <polygon points="16,72 20,56 30,42 44,32 58,28 70,28 84,32 98,42 108,56 112,72
                   100,76 64,78 28,76"
           fill="#4CAF50"/>

  <!-- lighter cap highlight strip -->
  <polygon points="30,42 44,32 58,28 70,28 84,32 98,42 88,44 64,44 40,44" fill="#6BD080"/>

  <!-- dark spots on the cap -->
  <circle cx="36" cy="54" r="6" fill="#2E7D32"/>
  <circle cx="64" cy="40" r="7" fill="#2E7D32"/>
  <circle cx="90" cy="52" r="6" fill="#2E7D32"/>
  <circle cx="52" cy="64" r="4" fill="#2E7D32"/>
  <circle cx="78" cy="62" r="5" fill="#2E7D32"/>

  <!-- eyes on the stem -->
  <ellipse cx="56" cy="84" rx="4" ry="6" fill="#2A2A2A"/>
  <ellipse cx="70" cy="84" rx="4" ry="6" fill="#2A2A2A"/>
  <circle cx="57" cy="82" r="1.5" fill="#FFFFFF"/>
  <circle cx="71" cy="82" r="1.5" fill="#FFFFFF"/>
</svg>