<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- 火焰发光 -->
    <filter id="fireGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 火焰粒子（背景） -->
  <circle cx="30" cy="50" r="6" fill="#ff4400" filter="url(#fireGlow)" opacity="0.6"/>
  <circle cx="100" cy="40" r="8" fill="#ff8800" filter="url(#fireGlow)" opacity="0.5"/>
  <circle cx="25" cy="90" r="5" fill="#ff2200" filter="url(#fireGlow)" opacity="0.7"/>
  <circle cx="105" cy="95" r="7" fill="#ffaa00" filter="url(#fireGlow)" opacity="0.6"/>

  <!-- 喷射火焰锥（从瞳孔向右上方喷出） -->
  <path d="M 64,70 Q 90,60 120,20 Q 105,50 120,40 Q 100,65 120,70 Q 95,75 80,80 Z" fill="#ff4400" filter="url(#fireGlow)" opacity="0.8"/>
  <path d="M 64,70 Q 85,65 110,35 Q 95,55 110,50 Q 90,70 105,75 Q 85,78 75,80 Z" fill="#ffaa00" filter="url(#fireGlow)" opacity="0.9"/>
  <path d="M 64,70 Q 80,68 100,50 Q 90,60 100,60 Q 85,72 90,78 Q 80,75 72,78 Z" fill="#ffdd44" filter="url(#fireGlow)"/>
  
  <!-- 飞溅火星 -->
  <circle cx="110" cy="30" r="2" fill="#ffdd44"/>
  <circle cx="115" cy="45" r="3" fill="#ff4400" filter="url(#fireGlow)"/>
  <circle cx="100" cy="20" r="1.5" fill="#ffffff"/>
  <circle cx="118" cy="65" r="2.5" fill="#ffaa00" filter="url(#fireGlow)"/>

  <!-- 眼球主体（炽热眼白） -->
  <circle cx="64" cy="70" r="38" fill="#ffcc66" stroke="#cc4400" stroke-width="3"/>
  <!-- 眼白上的烧焦纹理 -->
  <path d="M 35,60 Q 45,50 55,55" fill="none" stroke="#aa3300" stroke-width="2" opacity="0.6"/>
  <path d="M 85,80 Q 75,95 60,95" fill="none" stroke="#aa3300" stroke-width="2" opacity="0.6"/>
  
  <!-- 虹膜（燃烧的红色） -->
  <circle cx="64" cy="70" r="18" fill="#ff3300" stroke="#ff0000" stroke-width="2" filter="url(#fireGlow)"/>
  <!-- 瞳孔（黑色） -->
  <circle cx="64" cy="70" r="8" fill="#000000"/>
  <!-- 火焰高光 -->
  <circle cx="58" cy="64" r="3" fill="#ffcc00" filter="url(#fireGlow)"/>
</svg>