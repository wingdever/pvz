<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- 火焰发光滤镜 -->
    <filter id="flameGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- 火焰柱渐变（上亮下暗，模拟热量发散） -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="15%" stop-color="#ffcc00" stop-opacity="1" />
      <stop offset="50%" stop-color="#ff4400" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#660000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- === 背景火焰与余烬粒子 === -->
  <g filter="url(#flameGlow)">
    <circle cx="25" cy="80" r="6" fill="#ff4400" opacity="0.6"/>
    <circle cx="105" cy="70" r="8" fill="#ff8800" opacity="0.5"/>
    <circle cx="20" cy="110" r="4" fill="#ff2200" opacity="0.7"/>
    <circle cx="110" cy="115" r="5" fill="#ffaa00" opacity="0.6"/>
    <circle cx="35" cy="50" r="3" fill="#ffcc00" opacity="0.8"/>
    <circle cx="95" cy="45" r="4" fill="#ff4400" opacity="0.7"/>
  </g>

  <!-- === 塔身（焦黑火山岩 / 地狱肉体） === -->
  <!-- 塔基底座 -->
  <polygon points="35,128 93,128 85,50 43,50" fill="#1a1a1a" stroke="#0d0d0d" stroke-width="3"/>
  <!-- 岩浆裂纹（内部发光） -->
  <g filter="url(#flameGlow)">
    <path d="M 45,60 Q 55,80 48,100 Q 42,115 50,128" fill="none" stroke="#ff4400" stroke-width="3" stroke-linecap="round"/>
    <path d="M 83,60 Q 75,75 82,90 Q 88,105 80,120" fill="none" stroke="#ff8800" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 60,55 Q 65,70 58,85" fill="none" stroke="#ff2200" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- 塔身暗部与纹理（模拟岩石碎裂） -->
  <path d="M 43,50 L 52,65 L 45,80 L 55,95 L 48,115" fill="none" stroke="#2b2b2b" stroke-width="2" opacity="0.8"/>
  <path d="M 85,50 L 75,70 L 82,85 L 72,105 L 80,125" fill="none" stroke="#2b2b2b" stroke-width="2" opacity="0.8"/>

  <!-- === 持续喷射的火焰柱（向下喷射） === -->
  <!-- 外层火焰（宽大，暗红） -->
  <path d="M 64,45 Q 25,80 20,128 L 108,128 Q 103,80 64,45 Z" fill="#660000" filter="url(#flameGlow)" opacity="0.8"/>
  <!-- 中层火焰（主火焰，橙红） -->
  <path d="M 64,45 Q 35,85 35,128 L 93,128 Q 93,85 64,45 Z" fill="url(#flameGrad)" filter="url(#flameGlow)"/>
  <!-- 火焰的翻腾舌状边缘（饥荒风格的粗犷线条） -->
  <path d="M 35,128 Q 45,110 40,95 Q 50,115 55,128" fill="#ff4400" filter="url(#flameGlow)"/>
  <path d="M 93,128 Q 83,105 88,90 Q 78,110 73,128" fill="#ff4400" filter="url(#flameGlow)"/>
  <!-- 核心火焰（亮黄/白，高能区域） -->
  <path d="M 64,45 Q 50,90 50,128 L 78,128 Q 78,90 64,45 Z" fill="#ffaa00" filter="url(#flameGlow)"/>
  <!-- 最内层核心（刺眼白光） -->
  <path d="M 64,45 Q 58,95 58,128 L 70,128 Q 70,95 64,45 Z" fill="#ffffff" filter="url(#flameGlow)"/>

  <!-- === 火焰柱中飞舞的火星与余烬 === -->
  <g filter="url(#flameGlow)">
    <circle cx="45" cy="100" r="3" fill="#ffcc00"/>
    <circle cx="85" cy="90" r="2.5" fill="#ff8800"/>
    <circle cx="60" cy="115" r="4" fill="#ffffff"/>
    <circle cx="75" cy="110" r="2" fill="#ffcc00"/>
    <circle cx="30" cy="120" r="3" fill="#ff4400"/>
    <circle cx="100" cy="125" r="2" fill="#ffaa00"/>
    <!-- 向上飘散的细小火星 -->
    <circle cx="50" cy="80" r="1.5" fill="#ffcc00"/>
    <circle cx="80" cy="75" r="2" fill="#ff8800"/>
    <circle cx="65" cy="85" r="1" fill="#ffffff"/>
  </g>

  <!-- === 塔基触须（暗影，呼应眼球塔） === -->
  <path d="M 35,128 Q 15,125 20,115" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
  <path d="M 93,128 Q 113,125 108,115" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>

  <!-- === 塔顶的独眼（火焰之眼） === -->
  <!-- 眼眶（焦黑） -->
  <circle cx="64" cy="45" r="32" fill="#2b0d0d" stroke="#0d0d0d" stroke-width="4"/>
  <!-- 巩膜（炽热红橙色） -->
  <circle cx="64" cy="45" r="24" fill="#cc3300" stroke="#881100" stroke-width="2"/>
  <!-- 虹膜（亮黄/橙色，带有火焰旋涡纹理） -->
  <circle cx="64" cy="45" r="14" fill="#ffaa00" stroke="#ff4400" stroke-width="2" filter="url(#flameGlow)"/>
  <!-- 瞳孔（黑色垂直裂缝，能量溢出） -->
  <ellipse cx="64" cy="45" rx="4" ry="11" fill="#000000"/>
  <!-- 瞳孔边缘的火焰溢出 -->
  <path d="M 60,40 Q 64,45 60,50" fill="none" stroke="#ffcc00" stroke-width="1.5" filter="url(#flameGlow)"/>
  <path d="M 68,40 Q 64,45 68,50" fill="none" stroke="#ffcc00" stroke-width="1.5" filter="url(#flameGlow)"/>
  <!-- 眼球高光 -->
  <circle cx="56" cy="36" r="3" fill="#ffffff" opacity="0.9" filter="url(#flameGlow)"/>
</svg>