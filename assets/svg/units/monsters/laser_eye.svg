<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- 激光发光滤镜 -->
    <filter id="laserGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 瞬发激光束（从瞳孔射出） -->
  <polygon points="64,70 120,50 120,55 64,75" fill="#00ffff" filter="url(#laserGlow)" opacity="0.9"/>
  <polygon points="64,70 115,51 115,53 64,73" fill="#ffffff" filter="url(#laserGlow)"/>
  
  <!-- 激光火花 -->
  <circle cx="120" cy="52" r="3" fill="#00ffff" filter="url(#laserGlow)"/>
  <circle cx="115" cy="58" r="2" fill="#ffffff"/>
  <circle cx="105" cy="48" r="1.5" fill="#00ffff"/>

  <!-- 眼球主体（带血管的暗红眼白） -->
  <circle cx="64" cy="70" r="40" fill="#2b1b1b" stroke="#1a0d0d" stroke-width="3"/>
  <path d="M 30,60 Q 40,40 60,35" fill="none" stroke="#cc0000" stroke-width="2" stroke-linecap="round"/>
  <path d="M 90,50 Q 80,35 65,35" fill="none" stroke="#cc0000" stroke-width="2" stroke-linecap="round"/>
  <path d="M 35,85 Q 45,95 60,100" fill="none" stroke="#cc0000" stroke-width="2" stroke-linecap="round"/>
  <path d="M 95,80 Q 85,95 70,100" fill="none" stroke="#cc0000" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 虹膜（发光黄） -->
  <circle cx="64" cy="70" r="18" fill="#ffcc00" stroke="#ff8800" stroke-width="2"/>
  <!-- 瞳孔（黑色，猫眼状） -->
  <ellipse cx="64" cy="70" rx="6" ry="14" fill="#000000"/>
  <!-- 高光 -->
  <circle cx="58" cy="64" r="4" fill="#ffffff" opacity="0.8"/>
</svg>