<svg xmlns="http://www.w3.org/2000/svg" width="240" height="320" viewBox="0 0 240 320">
  <!-- 图鉴卡片底板 -->
  <rect x="10" y="10" width="220" height="300" rx="12" fill="#1e1e1e" stroke="#4a4a4a" stroke-width="2"/>
  <!-- 顶部图像区域 -->
  <rect x="20" y="20" width="200" height="160" rx="8" fill="#2c2c2c" stroke="#3b3b3b" stroke-width="1"/>
  <!-- 单位占位符（可替换为具体单位 SVG） -->
  <circle cx="120" cy="100" r="40" fill="#3b7dd8" opacity="0.3"/>
  <polygon points="110,80 130,80 130,120 110,120" fill="#f2c6a0" opacity="0.5"/>
  <!-- 名称栏 -->
  <rect x="20" y="190" width="200" height="30" rx="4" fill="#3b7dd8"/>
  <text x="120" y="210" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">单位名称</text>
  <!-- 阵营/标签栏 -->
  <rect x="20" y="228" width="60" height="20" rx="4" fill="#2c5aa0"/>
  <text x="50" y="242" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">人类</text>
  <rect x="90" y="228" width="60" height="20" rx="4" fill="#8b0000"/>
  <text x="120" y="242" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">普通</text>
  <!-- 属性栏 -->
  <line x1="20" y1="260" x2="220" y2="260" stroke="#4a4a4a" stroke-width="1"/>
  <text x="30" y="280" font-family="sans-serif" font-size="12" fill="#aaaaaa">生命值</text>
  <text x="210" y="280" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="end">320</text>
  <text x="30" y="300" font-family="sans-serif" font-size="12" fill="#aaaaaa">attack力</text>
  <text x="210" y="300" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="end">28</text>
</svg>