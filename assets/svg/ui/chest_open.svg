<?xml version="1.0" encoding="UTF-8"?>
<!--
  PvZ turn-based: UI art, the first-clear CHEST (open) - the same chest with the lid up,
  so "already claimed" reads at a glance without any text.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128">
  <!-- body -->
  <rect x="18" y="52" width="64" height="34" rx="3" fill="#8B5A2B"/>
  <!-- the open lid: tipped back above the body -->
  <rect x="16" y="20" width="68" height="16" rx="8" fill="#6E4522"/>
  <!-- what is left inside -->
  <rect x="24" y="46" width="52" height="8" rx="4" fill="#3A2412"/>
  <!-- iron bands -->
  <rect x="28" y="46" width="8" height="40" fill="#D9A441"/>
  <rect x="64" y="46" width="8" height="40" fill="#D9A441"/>
</svg>
