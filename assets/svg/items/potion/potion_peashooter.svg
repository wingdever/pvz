  <rect x="56" y="28" width="16" height="20" fill="#DBE6F2"/>
  <polygon points="52,46 76,46 86,112 42,112" fill="#DBE6F2"/>
  <polygon points="53,74 87,74 93,110 39,110" fill="#40BF4D"/>
