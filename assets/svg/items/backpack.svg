<?xml version="1.0" encoding="UTF-8"?>
<!--
  PvZ turn-based: placeholder icon v2, backpack.

  Body + top flap + front pocket + two shoulder straps + a filled top
  handle. Flat fills only, no strokes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- body -->
  <rect x="32" y="32" width="64" height="72" rx="10" fill="#7FD8E8"/>
  <!-- top flap -->
  <rect x="32" y="32" width="64" height="20" rx="10" fill="#4AB8D8"/>
  <!-- front pocket -->
  <rect x="44" y="64" width="40" height="28" rx="6" fill="#4AB8D8"/>
  <!-- left shoulder strap -->
  <rect x="40" y="24" width="8" height="16" rx="4" fill="#4AB8D8"/>
  <!-- right shoulder strap -->
  <rect x="80" y="24" width="8" height="16" rx="4" fill="#4AB8D8"/>
</svg>