<?xml version="1.0" encoding="UTF-8"?>
<!--
  PvZ turn-based: placeholder icon v2, garden watering can.

  Body (cream) + spout (bright green) + spout tip (dark green) + handle
  (bright green). Flat fills only, no strokes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- body -->
  <rect x="40" y="56" width="56" height="48" rx="8" fill="#E8D8B0"/>
  <!-- spout -->
  <polygon points="40,64 16,36 26,30 46,56" fill="#B8E04A"/>
  <!-- spout tip -->
  <rect x="14" y="30" width="14" height="6" fill="#2D8636"/>
  <!-- handle -->
  <path d="M96,64 Q116,64 116,84 L116,96 L108,96 L108,84 Q108,72 96,72 Z" fill="#B8E04A"/>
</svg>